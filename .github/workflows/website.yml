name: website

on:
  push:
    branches: [main]
    paths:
      ['website/**', 'docs/**', '.github/workflows/website.yml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install docs deps (standalone, not a workspace member)
        run: pnpm --dir docs install --frozen-lockfile --ignore-workspace
      - name: docs release gate (parity + no placeholders)
        run: pnpm --dir docs run check:locales:deploy
      - name: build website
        run: pnpm --filter @zturnlibs/ztron-website build
      - name: build docs
        run: pnpm --dir docs run build
      - name: assemble (docs under /docs/ subpath of the site artifact)
        run: |
          mkdir -p website/dist/docs
          cp -r docs/doc_build/. website/dist/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
