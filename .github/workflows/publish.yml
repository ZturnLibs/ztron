name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish:
    name: publish @zturnlibs/* to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zturnlibs"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (workspace)
        run: pnpm run build
      - name: unit tests
        run: pnpm test
      - name: pack dry-run (verify publishable tarballs)
        run: |
          for d in packages/*/; do
            echo "--- $d"
            (cd "$d" && npm pack --dry-run) || exit 1
          done
      # workspace:* protocols are not publishable; pnpm publish rewrites
      # them to the real version on pack. Publish leaf-first so a scoped
      # dependency exists by the time its dependents publish.
      - name: publish
        run: |
          for d in packages/inject packages/core packages/runtime-ffi packages/api packages/cli packages/driver; do
            echo "--- publishing $d"
            (cd "$d" && pnpm publish --no-git-checks --access restricted) || exit 1
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
