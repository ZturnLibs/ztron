name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish:
    name: publish @zturnlibs/ztron-* to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zturnlibs"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (workspace)
        run: pnpm run build
      - name: unit tests
        run: pnpm test
      - name: pack dry-run (verify publishable tarballs)
        run: |
          for d in packages/*/; do
            echo "--- $d"
            (cd "$d" && npm pack --dry-run) || exit 1
          done
      # workspace:* protocols are not publishable; pnpm pack rewrites
      # them to the real version on pack. Publish leaf-first so a scoped
      # dependency exists by the time its dependents publish.
      # pnpm publish E401s against GitHub Packages (it does not reliably
      # pick up the project .npmrc authToken), so pack with pnpm and push
      # with npm, which does.
      - name: pack (leaf-first, workspace:* rewritten)
        run: |
          rm -rf /tmp/tgz && mkdir -p /tmp/tgz
          for d in packages/inject packages/core packages/runtime-ffi packages/api packages/cli packages/driver; do
            echo "--- packing $d"
            (cd "$d" && pnpm pack --pack-destination /tmp/tgz) || exit 1
          done
          ls -la /tmp/tgz
      - name: publish tarballs to GitHub Packages
        run: |
          for tgz in /tmp/tgz/*.tgz; do
            echo "--- publishing $tgz"
            npm publish "$tgz" --access restricted --tag latest || exit 1
          done
