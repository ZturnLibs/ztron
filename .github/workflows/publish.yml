name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  native-darwin-arm64:
    name: build prebuilt native chain (macOS arm64)
    # macos-26 SDK: the macos-14 image's old Xcode miscompiles this exact
    # webview source into a libwebview that never executes page scripts
    # (0.3.5/0.3.6 shipped it — white-window packaged apps, byte-identical
    # d67228b4… builds). Local macOS 26 / clang 21 builds are verified good.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: build native chain (txiki.js + webview, cmake)
        run: bash scripts/build-native.sh
      - name: stage artifacts into the platform package
        run: |
          mkdir -p packages/native-darwin-arm64/native/libs
          for f in tjs ztron-host; do
            cp "native/libs/$f" "packages/native-darwin-arm64/native/libs/$f"
          done
          # build-native.sh's cp follows the cmake symlink chain, so native/libs
          # carries ONE real libwebview.dylib. ztron-host's install name is
          # @rpath/libwebview.0.12.dylib — stage the real file under all three
          # names (real copies; no symlink preservation concerns in tarballs).
          for f in libwebview.dylib libwebview.0.12.dylib libwebview.0.12.0.dylib; do
            cp "native/libs/libwebview.dylib" \
              "packages/native-darwin-arm64/native/libs/$f"
          done
      - name: verify artifact manifest
        run: |
          test -x packages/native-darwin-arm64/native/libs/tjs
          test -x packages/native-darwin-arm64/native/libs/ztron-host
          test -f packages/native-darwin-arm64/native/libs/libwebview.dylib
          test -f packages/native-darwin-arm64/native/libs/libwebview.0.12.dylib
      - name: pack platform package
        run: |
          cd packages/native-darwin-arm64
          npm pack --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: ztron-darwin-arm64-tgz
          path: /tmp/zturnlibs-ztron-darwin-arm64-*.tgz
          if-no-files-found: error

  native-win32-x64:
    name: build prebuilt native chain (Windows x64)
    runs-on: windows-latest
    env:
      # build-native.sh resolves vcpkg at ${VCPKG_ROOT:-/c/vcpkg} from Git
      # Bash; the runner's vcpkg lives at C:\vcpkg (VCPKG_INSTALLATION_ROOT).
      VCPKG_ROOT: /c/vcpkg
    steps:
      # webview-local.patch + `git apply` are CRLF-fragile; the runner image
      # default must not smudge the checkout.
      - name: keep the checkout LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: install libffi via vcpkg (tjs:ffi requirement)
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libffi:x64-windows'
      - name: build native chain (txiki.js + webview + host, cmake/MSVC)
        shell: bash
        env:
          WEBVIEW_CMAKE_ARGS: >-
            -DWEBVIEW_ENABLE_CHECKS=OFF
            -DWEBVIEW_BUILD_DOCS=OFF
            -DWEBVIEW_BUILD_TESTS=OFF
            -DWEBVIEW_BUILD_AMALGAMATION=OFF
        run: bash scripts/build-native.sh
      - name: stage artifacts into the platform package
        shell: bash
        run: |
          mkdir -p packages/native-win32-x64/native/libs
          # ffi-8.dll is the vcpkg libffi runtime tjs.exe loads at startup —
          # build-native.sh stages it beside tjs (packaging copies it from
          # there into app bundles; without it ztron-backend.exe won't start).
          for f in tjs.exe ztron-host.exe webview.dll ffi-8.dll; do
            cp "native/libs/$f" "packages/native-win32-x64/native/libs/$f"
          done
      - name: sanity (staged tjs.exe runs — proves ffi-8.dll resolves)
        shell: bash
        run: |
          cd packages/native-win32-x64/native/libs
          ./tjs.exe -v
      - name: verify artifact manifest
        shell: bash
        run: |
          test -f packages/native-win32-x64/native/libs/tjs.exe
          test -f packages/native-win32-x64/native/libs/ztron-host.exe
          test -f packages/native-win32-x64/native/libs/webview.dll
          test -f packages/native-win32-x64/native/libs/ffi-8.dll
      - name: pack platform package
        shell: bash
        run: |
          cd packages/native-win32-x64
          npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: ztron-win32-x64-tgz
          # runner.temp (runner context), NOT env.RUNNER_TEMP — default env
          # vars are invisible to the env context, which evals to an empty
          # string and makes the glob resolve at the drive root.
          path: ${{ runner.temp }}/zturnlibs-ztron-win32-x64-*.tgz
          if-no-files-found: error

  publish:
    name: publish @zturnlibs/ztron-* to GitHub Packages
    needs: [native-darwin-arm64, native-win32-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zturnlibs"
      # leaf-first: the CLI's optionalDependencies point at this package.
      # Must run after setup-node: setup-node writes the scoped .npmrc
      # (registry + authToken); without it the tarball's publishConfig
      # pins the publish to GPR regardless of the intended registry.
      - uses: actions/download-artifact@v4
        with:
          name: ztron-darwin-arm64-tgz
          path: /tmp/native-tgz
      - uses: actions/download-artifact@v4
        with:
          name: ztron-win32-x64-tgz
          path: /tmp/native-tgz-win
      # Idempotent: re-runs after a partial publish (e.g. a unit-test
      # failure downstream) must not die on E409 cannot-publish-over.
      - name: publish native platform package (darwin-arm64)
        run: |
          tgz=$(ls /tmp/native-tgz/zturnlibs-ztron-darwin-arm64-*.tgz)
          meta=$(tar -xzOf "$tgz" package/package.json)
          pkg=$(node -e "const p=JSON.parse(process.argv[1]);console.log(p.name+'@'+p.version)" "$meta")
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "--- $pkg already published, skipping"
          else
            npm publish "$tgz" --access restricted --tag latest || exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish native platform package (win32-x64)
        run: |
          tgz=$(ls /tmp/native-tgz-win/zturnlibs-ztron-win32-x64-*.tgz)
          meta=$(tar -xzOf "$tgz" package/package.json)
          pkg=$(node -e "const p=JSON.parse(process.argv[1]);console.log(p.name+'@'+p.version)" "$meta")
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "--- $pkg already published, skipping"
          else
            npm publish "$tgz" --access restricted --tag latest || exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (workspace)
        run: pnpm run build
      - name: unit tests
        run: pnpm test
      - name: pack dry-run (verify publishable tarballs)
        run: |
          for d in packages/*/; do
            echo "--- $d"
            (cd "$d" && npm pack --dry-run) || exit 1
          done
      # workspace:* protocols are not publishable; pnpm pack rewrites
      # them to the real version on pack. Publish leaf-first so a scoped
      # dependency exists by the time its dependents publish.
      # pnpm publish E401s against GitHub Packages (it does not reliably
      # pick up the project .npmrc authToken), so pack with pnpm and push
      # with npm, which does.
      - name: pack (leaf-first, workspace:* rewritten)
        run: |
          rm -rf /tmp/tgz && mkdir -p /tmp/tgz
          : > /tmp/tgz/order.txt
          for d in packages/inject packages/tjs-types packages/core packages/runtime-ffi packages/api packages/ztron-react packages/ztron-vue packages/ztron-svelte packages/cli packages/driver; do
            echo "--- packing $d"
            tgz=$(
              cd "$d" || exit 1
              pnpm pack --pack-destination /tmp/tgz > /dev/null
              node -e "const p=require('./package.json');console.log(p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz')"
            )
            echo "/tmp/tgz/$tgz" >> /tmp/tgz/order.txt
          done
          cat /tmp/tgz/order.txt
      # setup-node's .npmrc embeds the ${NODE_AUTH_TOKEN} placeholder —
      # the token must come from this step's env or every PUT is E401.
      # Idempotent: skip tarballs whose exact name@version is already in
      # the registry (re-run after a partial publish).
      - name: publish tarballs to GitHub Packages
        run: |
          while IFS= read -r tgz; do
            meta=$(tar -xzOf "$tgz" package/package.json)
            pkg=$(node -e "const p=JSON.parse(process.argv[1]);console.log(p.name+'@'+p.version)" "$meta")
            if npm view "$pkg" version >/dev/null 2>&1; then
              echo "--- $pkg already published, skipping"
              continue
            fi
            echo "--- publishing $tgz"
            npm publish "$tgz" --access restricted --tag latest || exit 1
          done < /tmp/tgz/order.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish @zturnlibs/ztron-* to npmjs (public)
    needs: [native-darwin-arm64, native-win32-x64]
    runs-on: ubuntu-latest
    # The exact version this run published — smoke pins it so the CDN
    # propagation window can't silently install the PREVIOUS release.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(node -e "console.log(require('./packages/api/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@zturnlibs"
      # leaf-first: the CLI's optionalDependencies point at this package.
      # Must run after setup-node: setup-node writes the scoped .npmrc
      # (registry + authToken); without it the tarball's publishConfig
      # pins the publish to GPR regardless of the intended registry.
      - uses: actions/download-artifact@v4
        with:
          name: ztron-darwin-arm64-tgz
          path: /tmp/native-tgz
      - uses: actions/download-artifact@v4
        with:
          name: ztron-win32-x64-tgz
          path: /tmp/native-tgz-win
      # Idempotent, same deal as the GitHub Packages job: re-runs must
      # tolerate an already-published name@version (E409) instead of dying.
      - name: publish native platform package (darwin-arm64)
        run: |
          tgz=$(ls /tmp/native-tgz/zturnlibs-ztron-darwin-arm64-*.tgz)
          meta=$(tar -xzOf "$tgz" package/package.json)
          pkg=$(node -e "const p=JSON.parse(process.argv[1]);console.log(p.name+'@'+p.version)" "$meta")
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "--- $pkg already published, skipping"
          else
            npm publish "$tgz" --access public --tag latest || exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish native platform package (win32-x64)
        run: |
          tgz=$(ls /tmp/native-tgz-win/zturnlibs-ztron-win32-x64-*.tgz)
          meta=$(tar -xzOf "$tgz" package/package.json)
          pkg=$(node -e "const p=JSON.parse(process.argv[1]);console.log(p.name+'@'+p.version)" "$meta")
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "--- $pkg already published, skipping"
          else
            npm publish "$tgz" --access public --tag latest || exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (workspace)
        run: pnpm run build
      # Same pack flow as the GitHub Packages job (pnpm pack rewrites
      # workspace:*; npm publish does the authenticated push — pnpm
      # publish E401s for the same GPR reason observed there).
      - name: pack (leaf-first, workspace:* rewritten)
        run: |
          rm -rf /tmp/tgz && mkdir -p /tmp/tgz
          : > /tmp/tgz/order.txt
          for d in packages/inject packages/tjs-types packages/core packages/runtime-ffi packages/api packages/ztron-react packages/ztron-vue packages/ztron-svelte packages/cli packages/driver; do
            echo "--- packing $d"
            tgz=$(
              cd "$d" || exit 1
              pnpm pack --pack-destination /tmp/tgz > /dev/null
              node -e "const p=require('./package.json');console.log(p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz')"
            )
            echo "/tmp/tgz/$tgz" >> /tmp/tgz/order.txt
          done
          cat /tmp/tgz/order.txt
      # Idempotent: skip tarballs whose exact name@version is already in
      # the registry (re-run after a partial publish).
      - name: publish tarballs to npmjs (public scoped)
        run: |
          while IFS= read -r tgz; do
            meta=$(tar -xzOf "$tgz" package/package.json)
            pkg=$(node -e "const p=JSON.parse(process.argv[1]);console.log(p.name+'@'+p.version)" "$meta")
            if npm view "$pkg" version >/dev/null 2>&1; then
              echo "--- $pkg already published, skipping"
              continue
            fi
            echo "--- publishing $tgz"
            npm publish "$tgz" --access public --tag latest || exit 1
          done < /tmp/tgz/order.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-npm:
    name: smoke — real npm install, doctor, init, build
    needs: publish-npm
    runs-on: macos-14
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install CLI (pin published version; wait for CDN propagation)
        run: |
          V="${{ needs.publish-npm.outputs.version }}"
          for i in $(seq 1 20); do
            if npm i -g "@zturnlibs/ztron-cli@$V"; then exit 0; fi
            echo "retry $i"; sleep 20
          done
          exit 1
      - name: doctor must be all green on the bundled chain alone
        run: ztron doctor
      - name: init + build a scaffolded app
        run: |
          cd "$(mktemp -d)"
          ztron init smoke-app
          cd smoke-app
          npm install --no-fund --no-audit
          ztron build
          test -d dist
          # Regression guard: 0.3.5 shipped a launcher that exec'd
          # MacOS/ztron-backend while the backend is staged in Resources —
          # the packaged app died at launch. Headless runners have no
          # WindowServer (the window never renders), but the host prints
          # its PORT before window creation, so the launcher must reach
          # the backend regardless.
          ./dist/ZtronApp.app/Contents/MacOS/ztron > /tmp/launch.log 2>&1 &
          LPID=$!
          sleep 8
          if ! kill -0 "$LPID" 2>/dev/null; then
            echo "launcher exited early:"; cat /tmp/launch.log; exit 1
          fi
          pgrep -f ztron-backend >/dev/null || { echo "backend never started"; cat /tmp/launch.log; exit 1; }
          pkill -f ztron-backend || true
          pkill -f ztron-host || true
      - name: driver bin smoke (--version/--help; no native remote needed)
        run: |
          V="${{ needs.publish-npm.outputs.version }}"
          for i in $(seq 1 20); do
            if npm i -g "@zturnlibs/ztron-driver@$V"; then break; fi
            echo "retry $i"; sleep 20
          done
          npm ls -g "@zturnlibs/ztron-driver@$V" || exit 1
          ztron-driver --version
          ztron-driver --help | grep -q -- "--native-driver"

  smoke-npm-windows:
    name: smoke windows — real npm install, doctor, init, build, launch
    needs: publish-npm
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ensure WebView2 Evergreen runtime (launch probe)
        shell: pwsh
        run: |
          # The host cannot create a WebView2 environment without the
          # runtime; runner images do not guarantee it. Idempotent.
          curl.exe -L -o MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          ./MicrosoftEdgeWebview2Setup.exe /silent /install
      - name: install CLI (pin published version; wait for CDN propagation)
        shell: bash
        run: |
          V="${{ needs.publish-npm.outputs.version }}"
          for i in $(seq 1 20); do
            if npm i -g "@zturnlibs/ztron-cli@$V"; then exit 0; fi
            echo "retry $i"; sleep 20
          done
          exit 1
      # THE platform-package assertion: doctor green with nothing built from
      # source — tjs/ztron-host/webview must all resolve from
      # @zturnlibs/ztron-win32-x64 (mirror of the mac smoke's contract).
      - name: doctor must be all green on the bundled chain alone
        shell: bash
        run: ztron doctor
      - name: init + build a scaffolded app + launch probe
        shell: bash
        run: |
          cd "$(mktemp -d)"
          ztron init smoke-app
          cd smoke-app
          npm install --no-fund --no-audit
          ztron build
          test -d dist
          # Payload manifest — flat layout, mirrors ci.sh win_packaged_spike.
          for f in ztron-host.exe ztron-backend.exe webview.dll ffi-8.dll \
                   frontend/index.html ztron.conf.json; do
            test -e "dist/ZtronApp/$f" || { echo "payload missing $f"; ls dist/ZtronApp; exit 1; }
          done
          # Launcher: MSVC-compiled exe on runners, .cmd fallback without
          # MSVC — either must exist (bundle bootable).
          L="dist/ZtronApp/ztron-launcher.exe"
          test -e "$L" || L="dist/ZtronApp/ztron-launcher.cmd"
          test -e "$L" || { echo "no launcher in payload"; ls dist/ZtronApp; exit 1; }
          # Launch: the process must stay up (a silent DLL/loader failure
          # exits early) and the backend must be running.
          "$L" > launch.log 2>&1 &
          LPID=$!
          sleep 12
          if ! kill -0 "$LPID" 2>/dev/null; then
            echo "launcher exited early:"; cat launch.log; exit 1
          fi
          head -20 launch.log
          tasklist //FI "IMAGENAME eq ztron-backend.exe" | grep -qi ztron-backend \
            || { echo "backend never started"; cat launch.log; exit 1; }
          # Best-effort teardown (runner is reimaged anyway).
          taskkill //F //IM ztron-backend.exe //T 2>/dev/null || true
          taskkill //F //IM ztron-host.exe //T 2>/dev/null || true
          taskkill //F //IM ztron-launcher.exe //T 2>/dev/null || true
