name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (workspace)
        run: pnpm run build
      - name: unit tests
        run: pnpm test

  native-linux:
    name: native host (linux, gtk+webkit compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install gtk / webkit2gtk dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential cmake
      - name: fetch webview upstream (vendored copy is gitignored)
        run: |
          git clone --depth 1 https://github.com/webview/webview.git native/webview
      - name: build webview library (stock upstream)
        run: |
          cmake -B native/webview/build -S native/webview \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBVIEW_BUILD=ON -DWEBVIEW_BUILD_SHARED_LIBRARY=ON \
            -DWEBVIEW_BUILD_DOCS=OFF \
            -DWEBVIEW_BUILD_TESTS=OFF \
            -DWEBVIEW_BUILD_AMALGAMATION=OFF
          cmake --build native/webview/build 2>&1 | tail -40
      # NOTE: the vendored webview checkout is not in git (patched at build
      # time). CI builds stock upstream; the vendored patches only touch
      # macOS code paths (cocoa backend) so the Linux link surface is
      # identical. The host C sources are what this job validates.
      - name: compile host_linux.c (syntax + link, -Wall -Werror)
        run: |
          cc -Wall -Werror -fsyntax-only native/host/host.c native/host/host_linux.c \
            -I native/webview/core/include \
            $(pkg-config --cflags gtk+-3.0 webkit2gtk-4.1)
          cc -Wall -Werror native/host/host.c native/host/host_linux.c \
            -o /tmp/ztron-host \
            -I native/webview/core/include \
            -L native/webview/build/core -lwebview \
            $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1) \
            -pthread -Wl,-rpath,'$ORIGIN'
      - name: smoke (host binary prints usage/help path)
        run: |
          # The host expects a port argument and starts a socket server;
          # running it briefly and killing it verifies the binary links and
          # starts. --help is not implemented; use a 2s timeout run.
          timeout 2 /tmp/ztron-host 0 || code=$?
          # exit 124 (timeout kill) or a clean exit both prove it started;
          # a crash would be 139/134.
          if [ "${code:-0}" = "139" ] || [ "${code:-0}" = "134" ]; then
            echo "host crashed on start"; exit 1
          fi

  native-windows:
    name: native host (windows, MSVC compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: fetch webview upstream (vendored copy is gitignored)
        run: |
          git clone --depth 1 https://github.com/webview/webview.git native/webview
      - name: build webview library (stock upstream, static)
        shell: cmd
        run: |
          cmake -B native\webview\build -S native\webview ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DWEBVIEW_BUILD=ON -DWEBVIEW_BUILD_STATIC_LIBRARY=ON ^
            -DWEBVIEW_BUILD_SHARED_LIBRARY=OFF ^
            -DWEBVIEW_BUILD_DOCS=OFF -DWEBVIEW_BUILD_TESTS=OFF ^
            -DWEBVIEW_BUILD_AMALGAMATION=OFF ^
            -DWEBVIEW_ENABLE_CHECKS=OFF
          cmake --build native\webview\build --config Release
      # See the linux job note: patches are macOS-only, the Windows surface
      # matches stock upstream.
      # host.c is POSIX-thread/socket-structured (pthread/ssize_t/select);
      # its Windows port (winsock threads) is future work. This job
      # validates the platform implementation file itself.
      - name: compile host_windows.c (syntax check)
        shell: cmd
        run: |
          cl -nologo -Zs -W4 -WX /D_CRT_SECURE_NO_WARNINGS ^
            -I native\webview\core\include ^
            native\host\host_windows.c

  # Manual-only: each run costs ~25 macos-runner minutes; local
  # `bash scripts/ci.sh` is the routine full-chain gate. macos free-tier
  # quota is limited — trigger this on demand (releases, risky changes).
  macos-spike:
    if: github.event_name == 'workflow_dispatch'
    name: macos full chain (native + check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: fetch txiki.js upstream (vendored copy is gitignored)
        run: |
          # Pinned to the commit the vendored copy tracks (native/txiki.js).
          git clone --filter=blob:none --no-checkout \
            https://github.com/saghul/txiki.js.git native/txiki.js
          git -C native/txiki.js checkout c3587a7
          git -C native/txiki.js submodule update --init --recursive
      - name: build txiki.js (tjs runtime)
        run: |
          cmake -S native/txiki.js -B native/txiki.js/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CLI=ON
          cmake --build native/txiki.js/build
          TJS="$(find native/txiki.js/build -name tjs -type f | head -1)"
          echo "tjs at: $TJS"
          echo "ZTRON_TJS=$PWD/$TJS" >> "$GITHUB_ENV"
      # Vendored webview/ is gitignored; clone stock upstream and apply the
      # exported local patches (same as scripts/build-native.sh does).
      - name: fetch vendored webview + apply patches
        run: |
          git clone --depth 1 https://github.com/webview/webview.git native/webview
          cd native/webview
          git apply ../../scripts/patches/webview-local.patch || \
            echo "patch already applied or not needed"
      - name: install clang-format (webview build requirement)
        run: brew install clang-format
      - name: full chain (build-native + units + ztron check spikes)
        env:
          # clang-tidy has no standalone homebrew formula; the macos runner
          # has no usable llvm-tidy on PATH either — disable tidy (format
          # stays on; the vendored patches are clang-format clean).
          # CI clang-format version disagrees with the locally formatted
          # vendored patch; format enforcement stays local (Xcode toolchain).
          WEBVIEW_CMAKE_ARGS: >-
            -DWEBVIEW_ENABLE_CHECKS=OFF
            -DWEBVIEW_BUILD_DOCS=OFF
            -DWEBVIEW_BUILD_TESTS=OFF
            -DWEBVIEW_BUILD_AMALGAMATION=OFF
        # The GUI spike needs an interactive WindowServer session; headless
        # CI macos runners hang at window creation (verified across multiple
        # runs — native build/units always pass first). Spikes run
        # best-effort here: a spike failure is logged as a warning and does
        # not fail the job; local runs remain the source of truth for GUI.
        run: |
          set +e
          bash scripts/ci.sh --spike-timeout 90000 > /tmp/ci-chain.log 2>&1
          code=$?
          tail -6 /tmp/ci-chain.log
          if grep -q "FAILED at: .*ztron check" /tmp/ci-chain.log; then
            echo "::warning::GUI spike failed on headless runner (expected without WindowServer); see ci-chain.log"
          elif [ $code -ne 0 ]; then
            exit $code
          fi

  docs:
    name: docs (parity + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (docs is standalone, not a workspace member)
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: unit tests (scripts)
        run: pnpm test
      - name: locale parity
        run: pnpm run check:locales
      # Regenerates both locales, then fails on any documented symbol
      # missing an api-zh.json key (or any orphaned key). Soft until the
      # translation batches land (P2 T9); remove continue-on-error then.
      - name: api translation coverage (strict, soft until T9)
        run: pnpm run gen:api:check
        continue-on-error: true
      - name: build
        run: pnpm run build
